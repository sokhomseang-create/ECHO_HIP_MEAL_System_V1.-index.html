const get=(t,id)=>rows[t].find(x=>x[CONFIG.schema[t][0].key]===id);if(['results','plans'].includes(k)&&!get('indicators',r['Indicator ID']))return 'Select an existing Indicator ID.';if(['attendance','qb'].includes(k)&&!get('activities',r['Activity ID']))return 'Select an existing Activity ID.';
if(k==='indicators'){if(r.Unit==='Percent'&&r.Aggregation!=='Ratio')return 'Percent indicators must use Ratio aggregation.';if(r.Unit!=='Percent'&&r.Aggregation==='Ratio')return 'Ratio aggregation requires Percent unit.';if(r.Unit==='Percent'&&((r.Baseline??0)>100||(r['Life target']??0)>100))return 'Percent values must be 0–100.';if(r.Unit==='Percent'&&(!r['Numerator definition']||!r['Denominator definition']))return 'Define the numerator and denominator.';if(r.Approval==='Approved'&&(!r['Approved by']||!r['Approval date']))return 'Record indicator approver and date.'}
if(k==='results'){const i=get('indicators',r['Indicator ID']);if(i?.Unit==='Percent'){if(typeof r.Numerator!=='number'||typeof r.Denominator!=='number'||r.Denominator<=0||r.Numerator>r.Denominator)return 'Provide numerator and denominator > 0, with numerator ≤ denominator.'}else if(typeof r['Count or hours']!=='number')return 'Enter Count or hours.';if(r.Status!=='Draft'&&!r['Partner approver'])return 'Partner approval requires a named approver.';if(['Verified','Approved'].includes(r.Status)&&!r['Verified by'])return 'Record the verifier.';if(r.Status==='Approved'&&(!r['Approved by']||!r['Approval date']||i?.Approval!=='Approved'))return 'Approve the indicator, then record final approver and date.';if(rows.results.some(x=>x['Record ID']!==r['Record ID']&&['Indicator ID','Period','Scope ID'].every(f=>x[f]===r[f])))return 'Duplicate indicator/period/scope. Use a shared scope ID for joint evidence to prevent double reporting.'}
if(k==='plans'){if(rows.plans.some(x=>x['Plan ID']!==r['Plan ID']&&x['Indicator ID']===r['Indicator ID']&&x.Period===r.Period))return 'Only one consolidated target per indicator and period.';if(get('indicators',r['Indicator ID'])?.Unit==='Percent'&&r.Target>100)return 'Percent target must be 0–100.'}
if(k==='attendance'){if(rows.attendance.some(x=>x['Attendance ID']!==r['Attendance ID']&&x['Activity ID']===r['Activity ID']&&x['Person code']===r['Person code']))return 'Person already recorded at this activity.';const other=rows.attendance.find(x=>x['Person code']===r['Person code']&&x['Attendance ID']!==r['Attendance ID']);if(other&&['Sex','Age group','Disability status'].some(f=>other[f]!==r[f]))return 'Person code has conflicting demographics. Check the source records and correct consistently.'}
if(['qb','dqa','learning'].includes(k)&&r.Status==='Verified closed'){if(!r['Verification evidence']&&!r['Closure evidence'])return 'Verified closure requires evidence.';if(k!=='learning'&&!r['Verified by'])return 'Record the closure verifier.'}
if(k==='qb'&&['Partially met','Not met'].includes(r.Rating)&&(!r.Action||!r.Owner||!r['Due date']))return 'A QB gap requires an action, owner and deadline.';
if(k==='activities'&&r.Status==='Completed'&&(!r['Evidence reference']||!r['Verified by']))return 'Completed activities require evidence and a verifier.';
if(k==='feedback'){if(r.Category==='Sensitive referral'&&(!r['Action or referral code']||r.Status==='Received'))return 'Refer immediately through the approved route. Record only a neutral referral code, never case details.';if(r.Status==='Closed'&&(!r['Response date']||!r['Loop closure evidence']))return 'Closing the feedback loop requires a response date and evidence.';if(r['Response date']&&r['Response date']<r['Received date'])return 'Response cannot precede receipt.'}
if(k==='evaluation'&&['Report signed','Management response completed'].includes(r.Status)&&(!r['Report reference']||!r['Sign-off date']||!r['Management response due']))return 'Signed studies require report, sign-off and management response due date.';if(k==='evaluation'&&r.Status==='Management response completed'&&!r['Management response evidence'])return 'Record management response evidence.';

function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}">No records yet.</td></tr>`}</tbody></table></div>`}
function approvedResults(id,p){return data('results').filter(r=>r['Indicator ID']===id&&r.Status==='Approved'&&(!p||r.Period===p))}
function compute(i,rows){if(!rows.length)return null;if(i.Aggregation==='Ratio'){const den=rows.reduce((s,r)=>s+(r.Denominator||0),0);return den?100*rows.reduce((s,r)=>s+(r.Numerator||0),0)/den:null}if(i.Aggregation==='Latest'){const latest=rows.map(r=>r.Period).sort().at(-1);const selected=rows.filter(r=>r.Period===latest);return selected.length===1?selected[0]['Count or hours']:null}return rows.reduce((s,r)=>s+(r['Count or hours']||0),0)}
const number=v=>v===null||v===undefined||v===''?'Not available':Number(v).toLocaleString(undefined,{maximumFractionDigits:1});
function ipttRows(period){return data('indicators').map(i=>{const rows=approvedResults(i['Indicator ID'],period),value=compute(i,rows),target=data('plans').find(p=>p['Indicator ID']===i['Indicator ID']&&p.Period===period)?.Target;const rate=value!==null&&typeof target==='number'&&target>0?value/target*100:null;const variance=rate!==null&&(rate<80||rate>120);return {i,rows,value,target,rate,variance}})}
function reach(period='All',province='All'){const acts=data('activities').filter(a=>a.Status==='Completed'&&a['Verified by']&&(period==='All'||quarter(a.Date)===period)&&(province==='All'||a.Province===province));const ids=new Set(acts.map(a=>a['Activity ID']));const attendance=data('attendance').filter(a=>ids.has(a['Activity ID']));const people=[...new Map(attendance.map(a=>[a['Person code'],a])).values()];return {acts,attendance,people}}
function quarter(date){return date?date.slice(0,4)+'-Q'+Math.ceil(Number(date.slice(5,7))/3):''}
function dashboard(){const r=reach();const open=data('feedback').filter(x=>x.Status!=='Closed').length;const overdue=['qb','dqa','learning','workplan'].flatMap(k=>data(k).filter(x=>x['Due date']&&x['Due date']<new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Phnom_Penh'})&&!['Verified closed','Completed'].includes(x.Status)));$('main').innerHTML=`<h2>Project overview</h2><div class="notice">Working version. ${data('indicators').filter(i=>i.Approval!=='Approved').length} proposed indicators await approval. No project achievements have been pre-filled.</div><div class="cards">${[['Completed activities',r.acts.length],['Unique participants',r.people.length],['Participation instances',r.attendance.length],['Open feedback',open],['Overdue actions',overdue.length],['Results awaiting final approval',data('results').filter(x=>x.Status!=='Approved').length]].map(([l,n])=>`<div class="card"><span>${l}</span><strong>${n}</strong></div>`).join('')}</div><section class="panel"><h3>Results awaiting decisions</h3><p>Only finally approved results appear in the IPTT report. Participation counts require completed, verified activities. Unique reach uses the same pseudonymous person code across SCI and CDPO.</p><p>Scope from kickoff: <b>12 communes, 12 villages, 12 schools</b>. These are planned locations, not achievements. Enter the endorsed site names through activity records.</p><h3>Inclusion in verified participation</h3>${table(['Group','Unique people'],[['Female',r.people.filter(x=>x.Sex==='Female').length],['Male',r.people.filter(x=>x.Sex==='Male').length],['Other / not disclosed',r.people.filter(x=>!['Female','Male'].includes(x.Sex)).length],['Children aged 0–17',r.people.filter(x=>['0-5','6-11','12-17'].includes(x['Age group'])).length],['With disability',r.people.filter(x=>x['Disability status']==='With disability').length],['Disability unknown / not disclosed',r.people.filter(x=>['Unknown','Not disclosed'].includes(x['Disability status'])).length]].map(x=>x.map(esc)))}</section><section class="panel"><h3>Period reach</h3><div class="toolbar"><select id="reachperiod"><option>All</option>${CONFIG.schema.results.find(x=>x.key==='Period').options.map(p=>`<option>${p}</option>`).join('')}</select><select id="reachprovince"><option>All</option><option>Kampong Chhnang</option><option>Kampong Cham</option></select></div><div id="reachdetail"></div><p class="muted">Do not add unique counts across periods, locations, partners or sub-themes. “New” means first verified participation recorded in this dataset; late records may change it.</p></section>`;function update(){const p=$('reachperiod').value,prov=$('reachprovince').value,v=reach(p,prov);const all=reach().attendance;let first=new Map;for(const a of all){const d=find('activities',a['Activity ID']).Date;if(!first.has(a['Person code'])||d<first.get(a['Person code']))first.set(a['Person code'],d)}const newly=v.people.filter(x=>p==='All'||quarter(first.get(x['Person code']))===p).length;$('reachdetail').textContent=`${v.acts.length} activities · ${v.attendance.length} participation instances · ${v.people.length} unique people · ${newly} first recorded in this period`}$('reachperiod').onchange=update;$('reachprovince').onchange=update;update()}
function iptt(){const periods=CONFIG.schema.results.find(f=>f.key==='Period').options;$('main').innerHTML=`<h2>Quarterly IPTT report</h2><p>Consolidated SCI/CDPO results. Percentages use summed numerators ÷ summed denominators × 100. Snapshot indicators require one consolidated record per period.</p><div class="toolbar"><label>Period <select id="period">${periods.map(p=>`<option ${p==='2026-Q4'?'selected':''}>${p}</option>`).join('')}</select></label><button id="csviptt">Export report CSV</button><button onclick="window.print()">Print / Save PDF</button></div><div id="iptttable"></div><div class="notice">Calendar quarters are used provisionally. Q2 2026 and Q2 2028 are partial project quarters. Confirm the award’s reporting calendar before official use. Life targets are reference values; this tool does not calculate cumulative target attainment.</div>`;function update(){const rows=ipttRows($('period').value);$('iptttable').innerHTML=table(['Indicator','Approval','Unit','Target','Approved actual','Achievement %','Review required'],rows.map(x=>[esc(x.i['Indicator ID']+' · '+x.i['Indicator wording']),esc(x.i.Approval),esc(x.i.Unit),number(x.target),number(x.value),x.rate===null?'Not calculated':number(x.rate)+'%',esc(!x.rows.length?'No approved observations':x.i.Aggregation==='Latest'&&x.rows.length>1?'Enter a single consolidated snapshot':x.variance&&!x.rows.every(r=>r['Variance explanation and action'])?'Add variance explanation and action':x.variance?'Variance explained':x.target===0?'Zero target: no attainment percentage':x.target===undefined?'Target not entered':'Within 80–120%')]))}$('period').onchange=update;$('csviptt').onclick=()=>csv('IPTT_'+$('period').value,['Indicator ID','Indicator','Period','Unit','Target','Actual','Achievement %','Evidence','Achievement explanation','Variance explanation'],ipttRows($('period').value).map(x=>[x.i['Indicator ID'],x.i['Indicator wording'],$ ('period').value,x.i.Unit,x.target??'',x.value??'',x.rate??'',x.rows.map(r=>r['Evidence reference']).join('; '),x.rows.map(r=>r['Achievement explanation']).join('; '),x.rows.map(r=>r['Variance explanation and action']||'').join('; ')]));update()}

const notes={indicators:'Six draft examples are proposed for design review. Replace them with approved award codes, wording, definitions and targets. These are not confirmed donor indicators.',results:'One row per indicator, quarter and non-overlapping evidence scope. A joint SCI/CDPO result must be reported once. Draft → Partner approved → Verified → Approved. Only Approved rows feed the report. Labels are self-recorded and do not enforce separation of duties.',plans:'Enter one approved consolidated SCI/CDPO target per indicator and quarter. Zero and missing targets remain distinct.',attendance:'Use pseudonymous codes only, never names, phone numbers or IDs. One row per person per activity. Agree a shared coding method with SCI and CDPO. Keep any re-identification key separately in an authorised system. Use approved disability questions, not visual judgement.',feedback:'Routine feedback metadata only. Never enter names, contacts, allegations, case narratives or sensitive evidence here. Refer safeguarding/fraud concerns immediately through approved channels and retain only a neutral referral code. Response deadlines must come from the approved SOP.',qb:'Activity ratings are Met / Partially met / Not met / Not applicable. These are not the project-level KPI17 0–3 scale. Each gap requires an action, owner and due date.',accountability:'Quarterly KPI18 evidence review. Criterion 3b is monitoring only. No automated KPI18 score is calculated. Use the current SCI reporting tool for official scoring.',budget:'Enter approved budget and actual expenditure separately. Do not sum different currencies. This register does not replace the finance ledger.',evaluation:'Draft study windows from kickoff: baseline Q4 2026 and final evaluation Q1 2028. Confirm dates and comparable methods. Management response is due within six weeks of final report sign-off. Enter the due date explicitly.'};

function openEditor(idx){editIndex=idx;const fields=CONFIG.schema[active],r=idx<0?{}:data(active)[idx];$('formtitle').textContent=(idx<0?'Add: ':'Edit: ')+CONFIG.labels[active];$('error').textContent='';$('fields').innerHTML=fields.map((f,n)=>{let opts=f.options;if(f.key==='Indicator ID'&&active!=='indicators')opts=data('indicators').map(i=>i['Indicator ID']);if(f.key==='Activity ID'&&active!=='activities')opts=data('activities').map(i=>i['Activity ID']);const attrs=`id="f${n}" ${f.required?'required':''}`;const val=r[f.key]??'';let control=opts.length||f.type==='select'?`<select ${attrs}><option value="">Select…</option>${opts.map(v=>`<option value="${esc(v)}" ${val===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`:f.type==='number'?`<input ${attrs} type="number" min="0" step="any" value="${esc(val)}">`:f.type==='date'?`<input ${attrs} type="date" value="${esc(val)}">`:`<textarea ${attrs} ${n===0&&idx>=0?'readonly':''}>${esc(val)}</textarea>`;return `<label for="f${n}">${esc(f.key)}${f.required?' *':''}${control}</label>`}).join('');$('editor').showModal()}
$('cancel').onclick=()=>$('editor').close();$('form').onsubmit=e=>{e.preventDefault();const r={};CONFIG.schema[active].forEach((f,n)=>{const v=$('f'+n).value.trim();if(v!=='')r[f.key]=f.type==='number'?Number(v):v});const id=CONFIG.schema[active][0].key;if(data(active).some((x,i)=>i!==editIndex&&x[id]===r[id])){$('error').textContent='ID already exists.';return}const err=checkRecord(active,r);if(err){$('error').textContent=err;return}const old=editIndex<0?null:data(active)[editIndex];if(editIndex<0)data(active).push(r);else data(active)[editIndex]=r;try{validateDB(db)}catch(e){if(old)data(active)[editIndex]=old;else data(active).pop();$('error').textContent=e.message;return}persist(`${old?'Updated':'Created'} ${active} ${r[id]}`);$('editor').close();render()};

function backup(){ $('main').innerHTML=`<h2>Backup & change history</h2><section class="panel"><p>The data stays in this browser on this device. Moving the HTML file does not move its stored data. CSV export includes the current register’s search results; full JSON backup includes all registers. Browser cleanup, private browsing, or some file viewers can lose or block storage.</p><div class="toolbar"><button class="primary" id="export">Download full JSON backup</button><button id="import">Restore JSON backup</button><button onclick="window.print()">Print current view</button></div><p>Keep backups in an approved restricted project folder after each work session. Restore replaces all current registers after validation. This version has no multi-user server, encryption, authenticated approvals, tamper-proof audit log, file attachments, or direct PRIME connection.</p></section><h3>Recent changes</h3>${table(['Timestamp','Action'],db.audit.slice(-100).reverse().map(r=>[esc(r.at),esc(r.action)]))}`;$('export').onclick=()=>download('ECHO_MEAL_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json');$('import').onclick=()=>$('restore').click()}
$('restore').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10000000)throw Error('Backup exceeds the 10 MB working limit.');const v=JSON.parse(await f.text());validateDB(v);if(!confirm('Replace all current records with this backup? Download a backup of your current records first.'))return;db=v;persist('Restored JSON backup');render()}catch(err){alert('Restore rejected: '+err.message)}finally{e.target.value=''}};
function guide(){ $('main').innerHTML=`<h2>Operating guide & approval checklist</h2><section class="panel"><h3>1. Confirm the system before official reporting</h3><ol><li>SCI Project Coordinator and SCI/CDPO MEAL focal persons confirm the approved logframe and indicator list. The six indicators supplied here are design proposals.</li><li>Complete each PIRS: definition, numerator, denominator, unit, aggregation, baseline, target, disaggregation, instrument/question, frequency, evidence and owner. Approve before reporting.</li><li>Confirm reporting quarters and internal deadlines, partner responsibilities, PRIME access, Total Reach sub-themes, and current KPI17/KPI18 tools. Nominate focal persons and orient users.</li><li>Confirm the 12 endorsed communes, villages and schools. The kickoff lists 12,000 target population alongside 23,617 population, 6,040 direct households and 3,849 students; these are different concepts. Do not turn them into beneficiary targets without approved definitions.</li><li>Approve the accountability plan, at least two preferred channels including an anonymous channel, child-friendly/accessible information and safe referral contacts. Agree response standards, consent, retention and secure evidence storage.</li></ol><h3>2. Record and verify delivery</h3><p>Before each activity, record its code, location, owner, intended participants, accessibility arrangements and planned evidence. During delivery, use approved attendance and observation tools. After delivery, retain signed source evidence and mark the activity Completed only after verification. Record participation using shared pseudonymous person codes.</p><p>Evidence references are pointers to approved files, not uploads. Keep source documents, contact details and personal data in authorised systems. This local tool is intended for pseudonymised operational data.</p><h3>3. Quarterly reporting procedure</h3><ol><li>Field teams collect and check source evidence. CDPO lead/MEAL verifies CDPO data; SCI MEAL/coordinator verifies SCI data.</li><li>Prepare separate partner results and secure partner approval. Use the same scope ID for shared SCI/CDPO evidence and count it only once.</li><li>SCI MEAL checks PIRS compliance, disaggregation, arithmetic, duplicates, evidence and outstanding DQA issues; returns queries and records corrections.</li><li>SCI MEAL consolidates verified results. SCI Project Coordinator approves the consolidated IPTT. Record approval names and date on each final row.</li><li>Export the approved period report. Explain achievement with calculation, disaggregation and evidence. Explain variances below 80% or above 120%, with actions.</li><li>SCI MEAL manually enters approved figures in PRIME at its confirmed frequency. SCI Project Coordinator leads the donor narrative with MEAL and CDPO support.</li></ol><p>Results are entered manually from verified evidence, not automatically from attendance. This preserves indicator-specific eligibility and prevents counting every activity as an outcome. No report value is a verified donor figure merely because it appears here.</p><h3>4. Calculation rules</h3><ul><li>Sum: add non-overlapping period observations. Scope IDs must identify a real non-overlapping population or evidence batch.</li><li>Ratio: sum numerators ÷ sum denominators × 100. Never average percentages. Use one observation per eligible person per measurement round. Repeated rounds belong in distinct periods or a defined snapshot.</li><li>Latest: one consolidated snapshot per indicator/period. Multiple snapshots produce “Not available” until consolidated.</li><li>Attainment: actual ÷ target × 100. A zero target and a missing target both suppress attainment; a recorded zero actual is valid.</li><li>Unique reach: distinct person codes from completed verified activities. Participation instances are separate. Do not sum unique reach across categories or periods. Baseline/endline samples and indirect reach require separate approved definitions.</li><li>The proposed response-hours measure is an event snapshot. Use a dedicated verified event analysis for multiple activations. If no activation occurred, leave the result absent.</li></ul></section><section class="panel"><h3>5. Quality, accountability and learning</h3><p><b>QBs:</b> an assessor independent of the activity lead uses technically agreed standards. Verify findings with the activity lead, record action/owner/deadline for every gap, obtain signatures in the source assessment, and verify closure. Review actions monthly and compile quarterly evidence. KPI17 has eight project-level criteria scored Fully 3 / Mostly 2 / Somewhat 1 / Not at all 0, excluding N/A. This activity register does not calculate that score. The kickoff references Q1/Q3 global PMT reporting; confirm the current schedule.</p><p><b>DQA:</b> risk-based checks cover completeness, validity, accuracy, consistency, timeliness and traceability. Check high-risk drill and beneficiary records before reporting. Record discrepancies, correction, owner, deadline and verified evidence. Reconcile all reported totals to source records.</p><p><b>Accountability:</b> share who we are, intended services, staff behaviour standards, how to participate and how to raise concerns. Consult children, women, persons with disabilities and low-literacy groups about preferred formats. Keep an anonymous option. Receive → triage → assign and act → respond and close the loop. Refer sensitive concerns immediately through approved routes. Record no sensitive narrative here. Anonymous feedback can close through a documented community response where appropriate. Review themes and adaptations quarterly.</p><p><b>Child participation:</b> apply transparent/informative, voluntary, respectful, relevant, child-friendly, inclusive, supported, safe and accountable participation. Record how views affected decisions and how decisions were shared back. The kickoff requires at least one of KPI18 2a/2b each quarter. Use the current official scoring tool.</p><p><b>Learning:</b> hold a drill AAR after each drill, monthly action reviews, quarterly reflection and annual learning. Ask: Did people receive, understand and act on the warning? Which groups faced barriers? Which approvals consumed lead time? Record evidence, decision, owner, deadline and verified change. Feed tested lessons into SOP updates and R3 learning products.</p><h3>6. Evaluation and resources</h3><p>External baseline and final evaluation are specified in the kickoff. Draft windows: Q4 2026 and Q1 2028. Confirm the schedule, ToR, sampling and comparable tools with SCI MEAL. Use disaggregated quantitative and qualitative evidence and assess relevance, coherence, effectiveness, efficiency, impact and sustainability. Do not claim attribution without an appropriate design. Complete the management response within six weeks of final report sign-off.</p><p>Cost baseline/endline, monitoring, DQA, QB visits, accessible feedback, learning, tools and staff time against approved budget lines. The kickoff mentions 3–10% as SCI guidance; this is not the confirmed ECHO allocation. Maintain finance approvals and currency-specific reconciliations outside this tool.</p></section><section class="panel"><h3>Responsibilities and cadence</h3>${table(['Role','Responsibility','Cadence'],[['SCI Project Coordinator','Oversight, SCI/consolidated approval and donor narrative','Monthly review and reporting dates'],['SCI MEAL focal person','PIRS/tools, verification, consolidation, PRIME and studies','Routine checks; quarterly reporting'],['CDPO Project Lead','Partner oversight, verification, approval and corrections','Routine supervision and partner deadlines'],['CDPO MEAL focal person','Source evidence, field checks, partner reporting and queries','After activities; quarterly reporting'],['Activity and action owners','Delivery evidence, inclusion checks and actions','Each activity and agreed due dates']].map(r=>r.map(esc)))}<h3>Source documents</h3><p>Design
